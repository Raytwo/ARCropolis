[package]
name = "menus"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5.11"
skyline-web = "0.2.0"
skyline-config = { git = "https://github.com/skyline-rs/skyline-config" }
log = "0.4.19"
smash-arc = { version = "0.6.0", default-features = false }
skyline = "0.6"
config = { path = "../config" }
camino = "1"
minreq = { version = "2", features = ["https-native", "json-using-serde"] }

[patch.crates-io]
native-tls = { git = "https://github.com/skyline-rs/rust-native-tls", rev = "f202fca"  }